services:
  # 1. Unified Backend Web Service (Flask API + Celery Worker)
  - type: web
    name: nextstep-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false # Set to Supabase Postgres URL in dashboard
      - key: REDIS_URL
        sync: false # Set to Upstash Redis URL in dashboard
      - key: CELERY_BROKER_URL
        sync: false # Set to Upstash Redis URL in dashboard
      - key: CELERY_RESULT_BACKEND
        sync: false # Set to Upstash Redis URL in dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # Set manually in dashboard
      - key: AI_PROVIDER
        value: gemini
      - key: CORS_ORIGINS
        sync: false # Set to Vercel Frontend URL after frontend is deployed
